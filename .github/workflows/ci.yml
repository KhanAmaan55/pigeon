name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  e2e-web:
    name: e2e (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  desktop-build:
    name: desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAURI_DIR: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.TAURI_DIR }} -> target
      - run: pnpm install --frozen-lockfile
      - name: cargo test
        run: cargo test --locked --manifest-path "$TAURI_DIR/Cargo.toml"
      - name: tauri build (unsigned)
        run: pnpm --filter @pigeon/desktop build
      - name: Smoke launch
        working-directory: ${{ env.TAURI_DIR }}/target/release
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum ./pigeon --smoke > smoke.log
          else
            ./pigeon --smoke > smoke.log
          fi
          cat smoke.log
          grep -qx 'smoke-ok' <(tr -d '\r' < smoke.log)
      - uses: actions/upload-artifact@v7
        with:
          name: pigeon-desktop-${{ runner.os }}
          path: |
            ${{ env.TAURI_DIR }}/target/release/bundle/dmg/*.dmg
            ${{ env.TAURI_DIR }}/target/release/bundle/nsis/*.exe
            ${{ env.TAURI_DIR }}/target/release/bundle/msi/*.msi
            ${{ env.TAURI_DIR }}/target/release/bundle/deb/*.deb
            ${{ env.TAURI_DIR }}/target/release/bundle/rpm/*.rpm
            ${{ env.TAURI_DIR }}/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
